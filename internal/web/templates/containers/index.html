{{template "layout.html" .}}

{{define "title"}}Containers — Brine{{end}}
{{define "header"}}Containers{{end}}

{{define "content"}}
<div class="index-page">
  <div class="index-heading"><div><span class="section-code">02 / RUNTIME</span><h1>Containers</h1></div><span class="index-count">LIVE</span></div>
  <div class="index-table overflow-x-auto">
    <table class="ui-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Image</th>
          <th>State</th>
          <th>Status</th>
          <th>Stack</th>
          <th>Ports</th>
          <th class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody
        id="containers-body"
        hx-get="/web/containers"
        hx-trigger="load, every 5s"
        hx-swap="innerHTML"
      >
        <tr>
          <td colspan="7" class="text-center py-8 text-dim">
            <span class="ui-spinner ui-spinner-sm"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
{{end}}
