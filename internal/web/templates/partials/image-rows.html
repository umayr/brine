{{range .}}
<tr class="hover:bg-raised/50" id="image-{{.ID}}">
  <td class="font-mono text-xs text-muted">{{.ID}}</td>
  <td>
    {{range .Tags}}
    <span class="ui-status ui-status-neutral ui-status-sm font-mono mr-1">{{.}}</span>
    {{else}}
    <span class="font-mono text-xs text-dim">untagged</span>
    {{end}}
  </td>
  <td class="font-mono text-xs text-muted">{{formatBytes .Size}}</td>
  <td class="font-mono text-xs text-muted">{{.Created.Format "2006-01-02"}}</td>
  <td class="text-right">
    <button class="ui-button ui-button-ghost ui-button-xs text-error"
      onclick="confirmAction('Remove image', 'Remove {{if .Tags}}{{index .Tags 0}}{{else}}{{.ID}}{{end}}?', () => removeImage('{{.ID}}'))"
    >Remove</button>
  </td>
</tr>
{{else}}
<tr><td colspan="5" class="text-center py-12 text-muted text-sm"><strong>No images found.</strong><br>The configured engine returned no images. Pull an image to add one.</td></tr>
{{end}}

<script>
function removeImage(id) {
  fetch(`/api/images/${id}`, { method: 'DELETE', headers: brineHeaders() })
    .then(res => {
      if (res.ok) {
        const body = document.getElementById('images-body');
        body.innerHTML = document.getElementById('images-loading').innerHTML;
        htmx.trigger(body, 'refresh-images');
        showToast('Image removed', 'success');
      } else {
        showToast('Remove failed', 'error');
      }
    });
}
</script>
