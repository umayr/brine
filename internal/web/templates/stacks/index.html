{{template "layout.html" .}}

{{define "title"}}Stacks — Brine{{end}}
{{define "header"}}Stacks{{end}}

{{define "header-actions"}}
<a href="/stacks/new" class="ui-button ui-button-primary ui-button-sm gap-1.5">
  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
  New stack
</a>
{{end}}

{{define "content"}}
<div class="index-page">
  <div id="stack-inventory" hx-get="/web/stacks" hx-trigger="load, every 5s, refresh-stacks" hx-swap="innerHTML" hx-sync="this:drop"
    hx-on::send-error="if (event.detail.elt === this) { this.innerHTML = document.getElementById('stacks-request-error').innerHTML; htmx.process(this.querySelector('button')); }"
    hx-on::response-error="if (event.detail.elt === this) { this.innerHTML = document.getElementById('stacks-request-error').innerHTML; htmx.process(this.querySelector('button')); }">
    <div class="index-heading"><div><span class="section-code">01 / CONFIGURATION</span><h1>Stacks</h1></div></div>
    <div class="index-table py-20 text-center"><span class="ui-spinner ui-spinner-sm" aria-hidden="true"></span> <span role="status">Loading stacks…</span></div>
  </div>
  <template id="stacks-request-error"><div class="index-heading"><div><span class="section-code">01 / CONFIGURATION</span><h1>Stacks</h1></div></div><div class="index-table py-20 text-center"><div role="alert" class="text-error">Stacks could not be loaded. Inventory is unavailable.</div><button class="ui-button ui-button-ghost ui-button-sm mt-2" hx-get="/web/stacks" hx-target="#stack-inventory" hx-swap="innerHTML" hx-sync="#stack-inventory:replace">Retry</button></div></template>
</div>

<script>
const stackActions = new Map();
const stackButtonMarkup = new WeakMap();

function updateStackActions() {
  document.querySelectorAll('#stack-inventory [data-stack-action]').forEach(button => {
    const action = stackActions.get(button.dataset.stackName);
    if (action) {
      if (!stackButtonMarkup.has(button)) stackButtonMarkup.set(button, button.innerHTML);
      button.disabled = true;
      if (action === button.dataset.stackAction) {
        button.innerHTML = '<span class="ui-spinner ui-spinner-xs"></span> ' + (action === 'deploy' ? 'Deploying' : 'Deleting');
      }
    } else if (stackButtonMarkup.has(button)) {
      button.disabled = false;
      button.innerHTML = stackButtonMarkup.get(button);
      stackButtonMarkup.delete(button);
    }
  });
}
document.getElementById('stack-inventory').addEventListener('htmx:afterSwap', updateStackActions);

async function deployStack(name, btn) {
  if (stackActions.has(name)) return;
  stackActions.set(name, 'deploy');
  updateStackActions();
  showToast('Deploying ' + name + '…', 'info');
  try {
    const res = await fetch(`/api/stacks/${name}/up`, { method: 'POST', headers: brineHeaders() });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    const stream = BrineUI.createStreamStatus();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      stream.push(chunk);
    }
    stream.push(decoder.decode());
    if (stream.status.error || !stream.status.done) {
      showToast('Deploy failed: ' + name, 'error');
    } else {
      showToast('Deploy complete: ' + name, 'success');
    }
  } catch {
    showToast('Deploy failed', 'error');
  } finally {
    stackActions.delete(name);
    updateStackActions();
    lucide.createIcons();
  }
}

async function deleteStack(name, removeContainers) {
  if (stackActions.has(name)) return;
  stackActions.set(name, 'delete');
  updateStackActions();
  try {
    const res = await fetch(`/api/stacks/${name}`, {
      method: 'DELETE',
      headers: brineHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({ remove_containers: !!removeContainers }),
    });
    if (!res.ok) {
      const text = await res.text();
      let msg = text;
      try { msg = JSON.parse(text).error || text; } catch {}
      showToast('Delete failed: ' + msg.slice(0, 300), 'error');
      return;
    }
    const inventory = document.getElementById('stack-inventory');
    htmx.trigger(inventory, 'htmx:abort');
    inventory.innerHTML = '<div class="index-table py-20 text-center"><span role="status">Loading stacks…</span></div>';
    htmx.trigger(inventory, 'refresh-stacks');
    showToast(removeContainers ? 'Stack and containers removed' : 'Stack deleted', 'success');
  } catch {
    showToast('Delete failed', 'error');
  } finally {
    stackActions.delete(name);
    updateStackActions();
    lucide.createIcons();
  }
}
</script>
{{end}}
