<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{.CSRF}}">
  <title>{{block "title" .}}Brine{{end}}</title>
  <script src="/static/theme.js"></script>
  <link href="/static/theme.css" rel="stylesheet">
  <link href="/static/vendor/app.css" rel="stylesheet">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/htmx-sse.js"></script>
  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/ui.js"></script>

</head>
<body class="bg-canvas min-h-screen">

<div class="app-shell flex min-h-screen">

  <!-- Sidebar -->
  <aside class="app-sidebar w-52 bg-panel border-r border-line flex flex-col shrink-0">
    <div class="sidebar-brand px-5 py-5 border-b border-line">
      <a href="/" class="brand-mark" aria-label="Brine home"><span class="brand-symbol" aria-hidden="true">b.</span><span>brine</span></a>
      <div class="brand-caption">CONTAINER CONTROL</div>
    </div>

    <nav class="flex-1 py-4 px-3 space-y-0.5">
      <a href="/" class="nav-item {{if eq .Page "dashboard"}}active{{end}}" {{if eq .Page "dashboard"}}aria-current="page"{{end}}>
        <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0" aria-hidden="true"></i>
        Overview
      </a>
      <a href="/stacks" class="nav-item {{if eq .Page "stacks"}}active{{end}}" {{if eq .Page "stacks"}}aria-current="page"{{end}}>
        <i data-lucide="layers" class="w-4 h-4 shrink-0" aria-hidden="true"></i>
        Stacks
      </a>
      <a href="/containers" class="nav-item {{if eq .Page "containers"}}active{{end}}" {{if eq .Page "containers"}}aria-current="page"{{end}}>
        <i data-lucide="container" class="w-4 h-4 shrink-0" aria-hidden="true"></i>
        Containers
      </a>
      <a href="/images" class="nav-item {{if eq .Page "images"}}active{{end}}" {{if eq .Page "images"}}aria-current="page"{{end}}>
        <i data-lucide="disc-3" class="w-4 h-4 shrink-0" aria-hidden="true"></i>
        Images
      </a>
      <a href="/recipes" class="nav-item {{if eq .Page "recipes"}}active{{end}}" {{if eq .Page "recipes"}}aria-current="page"{{end}}>
        <i data-lucide="braces" class="w-4 h-4 shrink-0" aria-hidden="true"></i>
        Snippets
      </a>
    </nav>

    <div class="sidebar-settings px-3 py-3 border-t border-line">
      <a href="/settings" class="nav-item {{if eq .Page "settings"}}active{{end}}" aria-label="Settings" title="Settings" {{if eq .Page "settings"}}aria-current="page"{{end}}>
        <i data-lucide="settings" class="w-4 h-4 shrink-0" aria-hidden="true"></i>
        <span class="nav-label">Settings</span>
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
    <header class="app-header bg-panel border-b border-line px-6 py-3.5 flex items-center justify-between shrink-0">
      <div class="text-sm text-muted">{{block "header" .}}Brine{{end}}</div>
      <div class="flex items-center gap-2">
        <div class="runtime-pill" title="Runtime selected when Brine started">
          <i data-lucide="info" class="w-3.5 h-3.5 text-info" aria-hidden="true"></i>
          <span class="runtime-label">ENGINE</span>
          <span class="font-mono font-semibold text-foreground">{{.RuntimeEngine}}</span>
        </div>
        {{block "header-actions" .}}{{end}}
        {{if .AuthEnabled}}
        <form method="post" action="/logout" class="inline-flex">
          <input type="hidden" name="_csrf" value="{{.CSRF}}">
          <button type="submit" class="ui-button ui-button-ghost ui-button-sm gap-1.5" title="Sign out">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
            <span class="text-xs text-muted">{{.User}}</span>
          </button>
        </form>
        {{end}}
      </div>
    </header>

    <main class="app-main flex-1 p-6 overflow-auto">
      {{block "content" .}}{{end}}
    </main>
  </div>
</div>

<div id="toasts" class="ui-toasts ui-toasts-top ui-toasts-end z-50" role="status" aria-live="polite" aria-atomic="false"></div>

<dialog id="confirm-modal" class="ui-dialog" aria-labelledby="modal-title" aria-describedby="modal-message">
  <div class="ui-dialog-panel">
    <h3 class="font-semibold text-base mb-1" id="modal-title">Confirm</h3>
    <p class="text-sm text-muted mb-4" id="modal-message"></p>
    <div id="modal-checkbox-wrap" class="ui-field mb-4 hidden">
      <label class="ui-label cursor-pointer justify-start gap-2 p-0">
        <input type="checkbox" id="modal-checkbox" class="ui-checkbox ui-checkbox-sm ui-checkbox-danger" checked>
        <span class="ui-label-text text-sm" id="modal-checkbox-label"></span>
      </label>
    </div>
    <div class="ui-dialog-actions">
      <button class="ui-button ui-button-ghost ui-button-sm" onclick="document.getElementById('confirm-modal').close()">Cancel</button>
      <button class="ui-button ui-button-danger ui-button-sm" id="modal-confirm-btn">Confirm</button>
    </div>
  </div>
  <form method="dialog" class="ui-dialog-backdrop"><button aria-label="Close dialog">close</button></form>
</dialog>

<script>
  document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  document.addEventListener('htmx:afterSettle',  () => lucide.createIcons());

  // Attach the CSRF token to every HTMX request and expose a helper for fetch().
  function csrfToken() {
    const meta = document.querySelector('meta[name="csrf-token"]');
    return meta ? meta.content : '';
  }
  function brineHeaders(extra) {
    const headers = Object.assign({}, extra || {});
    const token = csrfToken();
    if (token) headers['X-CSRF-Token'] = token;
    return headers;
  }
  document.addEventListener('htmx:configRequest', (e) => {
    const token = csrfToken();
    if (token) e.detail.headers['X-CSRF-Token'] = token;
  });

  function showToast(msg, type = 'info') {
    const div = document.createElement('div');
    div.className = `ui-notice ui-notice-${type} shadow-lg max-w-sm text-sm`;
    const span = document.createElement('span');
    span.textContent = msg; // never interpret server output as HTML
    div.appendChild(span);
    document.getElementById('toasts').appendChild(div);
    setTimeout(() => div.remove(), BrineUI.duration('--toast-duration', 4000));
  }

  function confirmAction(title, message, onConfirm, opts = {}) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-message').textContent = message;
    const wrap = document.getElementById('modal-checkbox-wrap');
    const cb = document.getElementById('modal-checkbox');
    if (opts.checkbox) {
      document.getElementById('modal-checkbox-label').textContent = opts.checkbox;
      cb.checked = opts.checked !== false;
      wrap.classList.remove('hidden');
    } else {
      wrap.classList.add('hidden');
    }
    const btn = document.getElementById('modal-confirm-btn');
    btn.onclick = () => {
      const checked = opts.checkbox ? cb.checked : false;
      document.getElementById('confirm-modal').close();
      onConfirm(checked);
    };
    document.getElementById('confirm-modal').showModal();
  }

  document.addEventListener('htmx:responseError', (e) => {
    showToast('Request failed — ' + e.detail.xhr.status, 'error');
  });
</script>
</body>
</html>
