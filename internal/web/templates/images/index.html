{{template "layout.html" .}}

{{define "title"}}Images — Brine{{end}}
{{define "header"}}Images{{end}}

{{define "header-actions"}}
<button class="btn btn-primary btn-sm"
  onclick="document.getElementById('pull-modal').showModal()"
>+ Pull image</button>
{{end}}

{{define "content"}}
<div class="space-y-4">

  <!-- Pull modal -->
  <dialog id="pull-modal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">Pull image</h3>
      <form
        hx-post="/web/images/pull"
        hx-target="#pull-output"
        hx-swap="innerHTML"
      >
        <div class="form-control">
          <label class="label"><span class="label-text">Image reference</span></label>
          <input type="text" name="ref" class="input input-bordered font-mono" placeholder="nginx:alpine" required>
        </div>
        <div class="modal-action">
          <button class="btn btn-ghost" type="button" onclick="document.getElementById('pull-modal').close()">Cancel</button>
          <button type="submit" class="btn btn-primary">Pull</button>
        </div>
      </form>
      <div id="pull-output" class="mt-3 font-mono text-xs max-h-40 overflow-y-auto"></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- Images table -->
  <div class="bg-base-100 rounded-box shadow-sm">
    <div class="overflow-x-auto">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tags</th>
            <th>Size</th>
            <th>Created</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody
          id="images-body"
          hx-get="/web/images"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <tr>
            <td colspan="5" class="text-center py-8 text-base-content/40">
              <span class="loading loading-spinner loading-sm"></span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
{{end}}
