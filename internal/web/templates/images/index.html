{{template "layout.html" .}}

{{define "title"}}Images — Brine{{end}}
{{define "header"}}Images{{end}}

{{define "header-actions"}}
<button class="ui-button ui-button-primary ui-button-sm"
  onclick="document.getElementById('pull-modal').showModal()"
>+ Pull image</button>
{{end}}

{{define "content"}}
<div class="index-page space-y-4">
  <div class="index-heading"><div><span class="section-code">03 / RUNTIME</span><h1>Images</h1><p class="text-muted text-sm mt-2">Images available to the configured container engine.</p></div></div>

  <!-- Pull modal -->
  <dialog id="pull-modal" class="ui-dialog" aria-labelledby="pull-modal-title">
    <div class="ui-dialog-panel">
      <h3 id="pull-modal-title" class="font-bold text-lg mb-4">Pull image</h3>
      <form
        hx-post="/web/images/pull"
        hx-target="#pull-output"
        hx-swap="innerHTML"
      >
        <div class="ui-field">
          <label class="ui-label" for="pull-ref"><span class="ui-label-text">Image reference</span></label>
          <input id="pull-ref" type="text" name="ref" class="ui-input font-mono" placeholder="nginx:alpine" required>
        </div>
        <div class="ui-dialog-actions">
          <button class="ui-button ui-button-ghost" type="button" onclick="document.getElementById('pull-modal').close()">Cancel</button>
          <button type="submit" class="ui-button ui-button-primary">Pull</button>
        </div>
      </form>
      <div id="pull-output" class="mt-3 font-mono text-xs max-h-40 overflow-y-auto"></div>
    </div>
    <form method="dialog" class="ui-dialog-backdrop"><button aria-label="Close dialog">close</button></form>
  </dialog>

  <!-- Images table -->
  <div class="index-table">
    <div class="overflow-x-auto">
      <table class="ui-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tags</th>
            <th>Size</th>
            <th>Created</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody
          id="images-body"
          hx-get="/web/images"
          hx-trigger="load, refresh-images"
          hx-swap="innerHTML"
          hx-on::send-error="this.innerHTML = document.getElementById('images-request-error').innerHTML; htmx.process(this.querySelector('button'))"
          hx-on::response-error="this.innerHTML = document.getElementById('images-request-error').innerHTML; htmx.process(this.querySelector('button'))"
        >
          <tr>
            <td colspan="5" class="text-center py-8 text-dim">
              <span class="ui-spinner ui-spinner-sm" aria-hidden="true"></span>
              <span role="status">Loading images…</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <template id="images-loading"><tr><td colspan="5" class="text-center py-8 text-dim"><span class="ui-spinner ui-spinner-sm" aria-hidden="true"></span> <span role="status">Loading images…</span></td></tr></template>
  <template id="images-request-error"><tr><td colspan="5" class="py-8 text-center"><div role="alert" class="text-error">Images could not be loaded. Inventory is unavailable.</div><button class="ui-button ui-button-ghost ui-button-sm mt-2" hx-get="/web/images" hx-target="#images-body" hx-swap="innerHTML">Retry</button></td></tr></template>

</div>
{{end}}
