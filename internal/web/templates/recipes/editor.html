{{template "layout.html" .}}

{{define "title"}}{{if .Recipe}}Edit {{.Recipe.Name}}{{else}}New Snippet{{end}} — Brine{{end}}

{{define "header"}}
<div class="flex items-center gap-2">
  <a href="/recipes" class="text-base-content/50 hover:text-base-content">Snippets</a>
  <span class="text-base-content/30">/</span>
  <span>{{if .Recipe}}{{.Recipe.Name}}{{else}}New{{end}}</span>
</div>
{{end}}

{{define "content"}}
<script type="module">
import { createBrinePklEditor } from '/static/vendor/editor.js';

document.addEventListener('DOMContentLoaded', () => {
  const ta = document.getElementById('recipe-body');
  if (!ta) return;
  createBrinePklEditor(ta, { minHeight: '18rem' });
});
</script>
<div class="max-w-3xl mx-auto space-y-5">
  <div class="bg-base-100 rounded-box shadow-sm p-6">
    <form
      {{if .Recipe}}
        hx-put="/web/recipes/{{.Recipe.Slug}}"
      {{else}}
        hx-post="/web/recipes"
      {{end}}
      hx-target="#recipe-result"
      hx-swap="innerHTML"
      class="space-y-5"
    >
      <div class="grid grid-cols-2 gap-4">
        <div class="form-control">
          <label class="label"><span class="label-text">Name</span></label>
          <input type="text" name="name" class="input input-bordered"
            value="{{if .Recipe}}{{.Recipe.Name}}{{end}}"
            placeholder="Simple Web Service" required />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Category</span></label>
          <input type="text" name="category" class="input input-bordered"
            value="{{if .Recipe}}{{.Recipe.Category}}{{end}}"
            placeholder="Web, Database, Patterns..." />
        </div>
      </div>

      <div class="form-control">
        <label class="label"><span class="label-text">Description</span></label>
        <input type="text" name="description" class="input input-bordered"
          value="{{if .Recipe}}{{.Recipe.Description}}{{end}}"
          placeholder="Short description of what this snippet does" />
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Pkl body</span>
          <span class="label-text-alt text-base-content/50">Fragment to insert into a stack</span>
        </label>
        <textarea
          id="recipe-body"
          name="body"
          class="textarea textarea-bordered font-mono text-sm h-72 resize-y"
          placeholder='["web"] {
  image = "nginx:alpine"
  ports = List("8080:80")
}'
          required
        >{{if .Recipe}}{{.Recipe.Body}}{{end}}</textarea>
      </div>

      <div class="flex items-center gap-3">
        <button type="submit" class="btn btn-primary">
          {{if .Recipe}}Save{{else}}Create snippet{{end}}
        </button>
        {{if .Recipe}}
        <button type="button" class="btn btn-ghost btn-sm text-error"
          hx-delete="/web/recipes/{{.Recipe.Slug}}"
          hx-target="body"
          onclick="return confirm('Delete snippet {{.Recipe.Name}}?')"
        >
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          Delete
        </button>
        {{end}}
        <a href="/recipes" class="btn btn-ghost ml-auto">Cancel</a>
      </div>

      <div id="recipe-result"></div>
    </form>
  </div>
</div>
{{end}}
