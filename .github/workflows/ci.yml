name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build web assets
        run: |
          npm ci
          npm run build:web
      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        # Credential fixtures require ACL-free canonical ancestry, not runner HOME.
        run: bash scripts/ci-test-go.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: brine:ci
          build-args: |
            VERSION=ci
      - name: Smoke test bundled binaries
        run: |
          docker run --rm brine:ci --version
          docker run --rm --entrypoint /usr/local/bin/dill brine:ci version
          docker run --rm --entrypoint /usr/local/bin/pkl brine:ci --version
      - name: Legacy Dill 0.5.0 and disabled Brine features
        run: |
          docker build --build-arg DILL_VERSION=0.5.0 -t brine:legacy-dill .
          if docker run --rm --entrypoint /usr/local/bin/dill brine:legacy-dill secret-capabilities --format json > /tmp/brine-old-dill-output 2>&1; then
            echo 'The legacy Dill unexpectedly claimed Alpha capabilities' >&2
            exit 1
          fi
          if grep -q 'dill.alpha-secrets/1' /tmp/brine-old-dill-output; then
            echo 'The legacy Dill advertised an unsupported contract' >&2
            exit 1
          fi
          for image in brine:ci brine:legacy-dill; do
            for option in '--profile=alpha' '--secret-target=lab-a' '--secret-policy=/synthetic-policy.json' '--secret-pkl=/synthetic-pkl' '--coordination-layout=native-local-docker-v1' '--operation-state-dir=/synthetic-history'; do
              if docker run --rm "$image" "$option" > /tmp/brine-disabled-flag 2>&1; then
                echo "Disabled option accepted: $image $option" >&2; exit 1
              fi
              grep -qi 'disabled' /tmp/brine-disabled-flag
            done
          done
          cid=$(docker run -d -p 127.0.0.1:18089:18089 brine:legacy-dill --port 18089 --bind 0.0.0.0 --api-token synthetic-ci-token)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18089/api/health >/dev/null && break || sleep 1; done
          curl -fsS -H 'Authorization: Bearer synthetic-ci-token' -H 'Content-Type: application/json' -d '{"name":"demo","pkl_content":"config {}"}' http://127.0.0.1:18089/api/stacks/ >/dev/null
          status=$(curl -sS -o /tmp/brine-old-image-api -w '%{http_code}' -H 'Authorization: Bearer synthetic-ci-token' http://127.0.0.1:18089/api/stacks/demo/secret-bindings)
          test "$status" = 503
          grep -q 'disabled' /tmp/brine-old-image-api
