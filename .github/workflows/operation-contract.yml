name: Local operation safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-operation-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify local endpoint routing, cleanup and secret-history downgrade gates
        run: >-
          go test ./cmd/brine -count=1
          -run '^(TestTwoEndpointRoutesAndAlphaBypass|TestCleanupRoutesWithUnavailableOrMismatchedRecipe|TestLegacySecretGateBlocksMutationButNotCleanup|TestSecretRecordDeniesDowngradeAfterConfigurationRemoval|TestUnknownContainerHistoryDeniesLegacyExecution)$'
