name: Broker released pair

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-pair:
    name: Paired broker contracts and real Docker lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: brine
      - name: Checkout Dill v0.12.0 toolchain definition (not a binary build)
        uses: actions/checkout@v4
        with:
          repository: umayr/dill
          ref: c30582f6f6e699849b8294b4e872d19b56b36506
          path: dill
      - uses: actions/setup-go@v5
        with:
          go-version-file: brine/go.mod
          cache-dependency-path: |
            brine/go.sum
            dill/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: brine/package-lock.json
      - name: Install pinned Pkl and verified released Dill
        working-directory: dill
        run: |
          grep -qx 'ARG DILL_VERSION=0.12.0' ../brine/Dockerfile
          python3 scripts/install-pkl.py "$RUNNER_TEMP/pkl"
          mkdir -p bin
          curl -fsSL --retry 3 https://github.com/umayr/dill/releases/download/v0.12.0/dill-linux-amd64 -o bin/dill
          curl -fsSL --retry 3 'https://github.com/umayr/dill/releases/download/v0.12.0/dill%400.12.0.zip' -o schema.zip
          echo '27e4298ccb60609f4405fbcdf387617617c2e4dcd74119191f86062cf791c126  bin/dill' | sha256sum -c
          echo '2f2c1c622b9aa7f386c7d401bd912abe289a68554e1974da1bde0b6cceb6b413  schema.zip' | sha256sum -c
          test "$(unzip -Z1 schema.zip)" = dill.pkl
          unzip -p schema.zip dill.pkl > released-dill.pkl
          cmp dill.pkl released-dill.pkl
          chmod 0700 bin/dill
          test "$(bin/dill version)" = v0.12.0
      - name: Build web assets and browser tooling
        working-directory: brine
        run: |
          npm ci
          npm run build:web
          npx playwright install --with-deps chromium
      - name: Paired CLI contracts and authenticated synthetic browser flow
        working-directory: brine
        env:
          BRINE_TEST_DILL_BROKER_BINARY: ${{ github.workspace }}/dill/bin/dill
          BRINE_TEST_DILL: ${{ github.workspace }}/dill/bin/dill
          BRINE_TEST_DILL_SCHEMA: ${{ github.workspace }}/dill/released-dill.pkl
          BRINE_BROKER_BROWSER_MODULE: ${{ github.workspace }}/brine/node_modules/playwright
          DILL_PKL_PATH: ${{ runner.temp }}/pkl
        run: |
          go test -race ./internal/brokerwire ./internal/dill ./internal/agentclient ./internal/brokerapp -count=1
          go test -race ./internal/web -run '^TestBrokerAuthenticatedHTTPWorkflow$' -count=1 -v -timeout 180s
      - name: Real disposable Docker broker lifecycle
        working-directory: brine
        run: |
          # Explicit disposable-host grant; never target an operator service.
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$(uname -s)" = Linux
          test ! -e /.dockerenv
          sudo systemctl is-active --quiet docker
          docker --host unix:///var/run/docker.sock pull nginx:alpine
          fixture=$(sudo mktemp -d /srv/brine-broker-ci.XXXXXXXX)
          sudo chmod 0700 "$fixture"
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/brokerapp.test" ./internal/brokerapp
          sudo install -m 0700 "$RUNNER_TEMP/brokerapp.test" "$fixture/brine-brokerapp.test"
          sudo install -m 0700 "$GITHUB_WORKSPACE/dill/bin/dill" "$fixture/dill"
          sudo install -m 0700 "$RUNNER_TEMP/pkl" "$fixture/pkl"
          sudo install -m 0600 "$GITHUB_WORKSPACE/dill/released-dill.pkl" "$fixture/dill.pkl"
          sudo env BRINE_BROKER_RUNTIME_TEST=1 BROKER_TEST_ROOT="$fixture" \
            "$fixture/brine-brokerapp.test" -test.run '^TestBrokerRuntimeLocalFile$' -test.v -test.timeout 300s
