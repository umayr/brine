name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

concurrency:
  group: brine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish tagged image
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/umayr/brine
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release ref
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and upload untagged candidate
        uses: docker/build-push-action@v6
        id: candidate
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/umayr/brine,push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/umayr/brine
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Smoke test both architectures by digest
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$IMAGE@$DIGEST"
          dill_version=$(awk -F= '$1 == "ARG DILL_VERSION" {print $2}' Dockerfile)
          pkl_version=$(awk -F= '$1 == "ARG PKL_VERSION" {print $2}' Dockerfile)
          test -n "$dill_version" && test -n "$pkl_version"
          for platform in linux/amd64 linux/arm64; do
            test "$(docker run --rm --platform "$platform" "$image" --version)" = "$VERSION"
            test "$(docker run --rm --platform "$platform" --entrypoint dill "$image" version)" = "v$dill_version"
            output=$(docker run --rm --platform "$platform" --entrypoint pkl "$image" --version)
            [[ "$output" == "Pkl $pkl_version "* ]]
          done
      - name: Publish version tag and GitHub release
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! existing=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION" 2>&1); then
            case "$existing" in
              *'not found'*) docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST" ;;
              *) printf '%s\n' "$existing" >&2; exit 1 ;;
            esac
          elif [[ "$existing" != "$DIGEST" ]]; then
            echo 'Refusing to replace a different versioned image' >&2
            exit 1
          fi
          tagged_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION")
          test "$tagged_digest" = "$DIGEST"
          notes=$(printf 'Container image (Linux amd64 and arm64): `%s`\n\nDigest: `%s`\n' "$IMAGE:$VERSION" "$IMAGE@$DIGEST")
          gh release create "$VERSION" --verify-tag --generate-notes --notes "$notes"
