name: Protected source fixture

on:
  pull_request:
    paths:
      - '.github/workflows/protected-source.yml'
      - 'scripts/check-protected-source.sh'
      - 'scripts/protected-source-capture/**'
      - 'internal/projectsnapshot/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - '.github/workflows/protected-source.yml'
      - 'scripts/check-protected-source.sh'
      - 'scripts/protected-source-capture/**'
      - 'internal/projectsnapshot/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the synthetic capture helper
        run: go build -o "$RUNNER_TEMP/protected-source-capture" ./scripts/protected-source-capture
      - name: Validate a protected synthetic capture without an engine
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT bash scripts/check-protected-source.sh "$RUNNER_TEMP/protected-source-capture"
