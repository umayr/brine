name: 'Synthetic named SQLite Linux qualification for #214'

# Publishing the separate test-only branch does not trigger this workflow.
on:
  push:
    tags: [verify-sqlite-214-linux-87a1c9f]

permissions:
  contents: read

jobs:
  sqlite-214-qualification:
    if: github.repository == 'umayr/brine' && github.event_name == 'push' && github.ref == 'refs/tags/verify-sqlite-214-linux-87a1c9f'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      REVIEWED_MERGE: 0e05e90c8023c4400fda173c9697cfd72ed72de7
      REVIEWED_TREE: 094baa46cdec61642c574c23394cf4ae51d2905d
      LIFECYCLE_SHA256: 0348e4d594b4225d74ce707e75a17884752c1bf5fbf36025669ff292010fc255
      STORAGE_SHA256: c342b3e478f90b38ae19da3a8ea91d6c50ac6323745afd44317688dd145ed245
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: 'Verify exact #214 source and test-only wrapper'
        shell: bash
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" && $(git show -s --format=%P HEAD) == "$REVIEWED_MERGE" ]]
          [[ $(git rev-parse "$REVIEWED_MERGE^{tree}") == "$REVIEWED_TREE" ]]
          diff -u <(printf '%s\n' .github/workflows/sqlite-214-linux-qualification.yml scripts/sqlite-214-linux-qualification.sh) <(git diff --name-only "$REVIEWED_MERGE" HEAD)
          [[ $(go version) == 'go version go1.27.3 linux/amd64' ]]
          sha256sum --check --strict <<'HASHES'
          ceede59cf32fe097a1b6934c8e438cad7ec7064c2901f9cb074a42a018d44f65  scripts/sqlite-214-linux-qualification.sh
          HASHES
      - name: Build and verify both exact Linux test binaries
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/brine-214-build.XXXXXXXX")
          export GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org GONOPROXY= GONOSUMDB= GOPRIVATE= GOFLAGS=
          go mod download
          go mod verify
          export GOPROXY=off GOSUMDB=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1
          go test -trimpath -buildvcs=false -c -o "$scratch/lifecycle.test" ./internal/metricshistory
          go test -trimpath -buildvcs=false -c -o "$scratch/storage.test" ./internal/metricshistory/sqlitestore
          a=$(sha256sum "$scratch/lifecycle.test" | awk '{print $1}')
          b=$(sha256sum "$scratch/storage.test" | awk '{print $1}')
          printf 'Linux/amd64 lifecycle SHA-256: %s\nLinux/amd64 storage SHA-256: %s\n' "$a" "$b"
          [[ "$a" == "$LIFECYCLE_SHA256" && "$b" == "$STORAGE_SHA256" ]]
          printf 'VERIFY_ROOT=%s\n' "$scratch" >> "$GITHUB_ENV"
      - name: Isolated lifecycle named verdict
        shell: bash
        run: bash scripts/sqlite-214-linux-qualification.sh "$VERIFY_ROOT/lifecycle.test" "$LIFECYCLE_SHA256" lifecycle
      - name: Isolated storage named verdicts
        shell: bash
        run: bash scripts/sqlite-214-linux-qualification.sh "$VERIFY_ROOT/storage.test" "$STORAGE_SHA256" storage
