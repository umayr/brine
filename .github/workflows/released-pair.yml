name: Released pair pilot

on:
  pull_request:
    paths:
      - '.github/workflows/released-pair.yml'
      - 'scripts/released-pair-pilot.sh'
      - 'scripts/released-pair-pilot.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/released-pair-pilot.sh
